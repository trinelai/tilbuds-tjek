name: Ugentlig tilbuds-tjek
on:
  schedule:
    # Kører hver søndag, torsdag, fredag, lørdag kl. 00:00 UTC (01:00 CET vintertid/02:00 CET sommertid)
    - cron: "0 0 * * 0,4,5,6"
  workflow_dispatch:
jobs:
  check-deals:
    runs-on: ubuntu-latest
    steps:
      - name: Hent kode fra repository
        uses: actions/checkout@v6
      - name: Opsæt Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Installér afhængigheder
        run: pip install requests beautifulsoup4
      - name: Kør tilbuds-tjek og send mail
        env:
          EMAIL_SENDER:   ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: python check_tilbud.py
